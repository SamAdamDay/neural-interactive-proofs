name: Set up NIP
description: Install the requirements and the nip package
runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.7.13"
        enable-cache: true
        cache-dependency-glob: "uv.lock"
    - name: "Set up Python"
      uses: actions/setup-python@v5
      with:
        python-version-file: ".python-version"
    - name: Copy the .env template, so that default environment variables are set
      run: |
        cp .env.template .env
      shell: bash
    - name: Install dependencies with uv
      run: |
        uv sync --locked
        uv sync --locked --all-extras --dev
      shell: bash
