# This workflow checks if the changelog file is updated when a pull request is made. To
# display the check on a pull request, add a `no changelog` label to the pull request.

name: Check for updates to CHANGELOG
on:
  pull_request:
    types: [assigned, opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
jobs:
  Check-Changelog:
    name: Check Changelog Action
    runs-on: ubuntu-latest
    steps:
      - uses: tarides/changelog-check-action@v2
        with:
          changelog: CHANGELOG.md
