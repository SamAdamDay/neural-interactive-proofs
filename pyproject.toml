[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "nip"
version = "1.0.0"
requires-python = ">= 3.11"
dependencies = [
    "datasets==2.21.0",
    "einops==0.8.0",
    "gitpython==3.1.44",
    "httpx==0.27.0",
    "huggingface-hub==0.32.4",
    "ipykernel==6.29.4",
    "ipython==8.25.0",
    "ipywidgets==8.1.3",
    "jaxtyping==0.2.30",
    "jinja2==3.1.4",
    "json5==0.9.25",
    "matplotlib==3.9.0",
    "nbformat==5.10.4",
    "networkx==3.3",
    "numpy==2.1.0",
    "openai==1.59.8",
    "pandas==2.2.2",
    "plotly==5.22.0",
    "pydantic==2.11.5",
    "python-dotenv==1.0.1",
    "pyyaml==6.0.2",
    "safetensors==0.4.3",
    "scikit-learn==1.5.0",
    "tensordict==0.6.0",
    "textdistance==4.6.3",
    "timm==1.0.7",
    "torch==2.7.0",
    "torch-geometric==2.5.3",
    "torchrl==0.6.0",
    "torchvision==0.22.0",
    "tqdm==4.66.4",
    "tqdm-multiprocess==0.0.11",
    "wandb==0.17.2",
    "werkzeug==3.1.3",
]

[project.optional-dependencies]
lm-server = [
    "accelerate==1.7.0",
    "bitsandbytes==0.46.0",
    "deepspeed==0.17.1",
    "fastapi==0.115.6",
    "loralib==0.1.2",
    "pydantic-settings==2.9.1",
    "transformers==4.52.4",
    "trl[peft]==0.15.2",
    "vllm==0.9.0",
]

[dependency-groups]
dev = [
    "black==24.4.2",
    "flake8==7.1.0",
    "holistictraceanalysis==0.2.0",
    "libtmux==0.37.0",
    "markdown==3.6",
    "numpydoc==1.8.0",
    "pre-commit==3.7.1",
    "pypandoc-binary==1.15",
    "pytest==8.2.2",
    "ruff==0.6.9",
    "sphinx==8.1.3",
    "sphinx-autobuild==2024.10.3",
    "sphinx-book-theme==1.1.3",
    "sphinx-tabs==3.4.7",
    "sphinxcontrib-autoprogram==0.1.9",
    "sphinxcontrib-bibtex==2.6.3",
    "sphinxcontrib-httpdomain==1.8.1",
    "sphinxcontrib-mermaid==1.0.0",
    "sympy==1.14.0",
    "tensorboard==2.17.0",
    "torch-tb-profiler==0.4.3",
]

[tool.uv]
add-bounds = "exact"

# [[tool.uv.index]]
# name = "pytorch-cu121"
# url = "https://download.pytorch.org/whl/cu121"
# explicit = true

# [tool.uv.sources]
# torch = [
#   { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
# ]
# torchvision = [
#   { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
# ]

[tool.black]
extend-exclude = "nip/utils/runtime_module.py|doc/extensions"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "playground",
    "nip/utils/runtime_module.py",
    "nip/utils/apps_metric.py",
    "doc/extensions",
]

# Same as Black.
line-length = 88
indent-width = 4

# Assume Python 3.11
target-version = "py311"

[tool.ruff.lint]
# Enable Pyflakes print statement checker.
select = ["E4", "E7", "E9", "F", "T20", "D"]
ignore = ["F401", "F722", "E731", "E712", "F821", "F541", "D202", "D105"]

# Allow fix for all enabled rules (when `--fix`) is provided.
fixable = ["ALL"]
unfixable = []

exclude = [
    "docker/*",
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.numpydoc_validation]
checks = [
    "all",   # report on all checks, except the below
    "EX01",
    "SA01",
    "ES01",
]
exclude = [  # don't report on objects that match any of these regex
    'wandb',
]
